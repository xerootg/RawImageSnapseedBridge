name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.1

      - name: Display Version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "VersionCode: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: docker compose build

      - name: Generate Release Keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD || 'raw2dng-release-key' }} \
            -keypass ${{ secrets.KEY_PASSWORD || 'raw2dng-release-key' }} \
            -dname "CN=Raw2DNG, OU=Development, O=Raw2DNG, L=Unknown, ST=Unknown, C=US"

      - name: Create keystore.properties
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cat > keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD || 'raw2dng-release-key' }}
          keyPassword=${{ secrets.KEY_PASSWORD || 'raw2dng-release-key' }}
          keyAlias=release
          storeFile=../release.keystore
          EOF

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker compose run --rm \
            -e VERSION_NAME=${{ steps.gitversion.outputs.semVer }} \
            -e VERSION_CODE=${{ steps.gitversion.outputs.commitsSinceVersionSource }} \
            -e CI=true \
            android-builder

      - name: Build Debug APK
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: |
          docker compose run --rm \
            -e VERSION_NAME=${{ steps.gitversion.outputs.semVer }} \
            -e VERSION_CODE=${{ steps.gitversion.outputs.commitsSinceVersionSource }} \
            android-builder

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw2dng-${{ steps.gitversion.outputs.semVer }}
          path: |
            output/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Release ${{ steps.gitversion.outputs.semVer }}
          body: |
            ## Raw2DNG ${{ steps.gitversion.outputs.semVer }}
            
            ### Installation
            Download `app-release.apk` and install on your Android device.
            
            ### Version Info
            - Version: ${{ steps.gitversion.outputs.semVer }}
            - Version Code: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}
            - Commit: ${{ github.sha }}
            
            ### Note
            This is a signed release build generated automatically from the main branch.
          files: output/app-release.apk
          draft: false
          prerelease: false
