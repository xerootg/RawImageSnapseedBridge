mode: ContinuousDeployment
branches:
  main:
    regex: ^main$
    tag: ''
    increment: Patch
  develop:
    regex: ^develop$
    tag: beta
    increment: Minor
  feature:
    regex: ^feature[/-]
    tag: alpha
    increment: Minor
  release:
    regex: ^release[/-]
    tag: rc
    increment: None
  pull-request:
    regex: ^pull/
    tag: pr
    increment: Inherit
assembly-versioning-scheme: MajorMinorPatch
tag-prefix: v
